name: Testes de API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar API
        run: |
          npm start > api.log 2>&1 &
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
          PORT: 3081

      - name: Aguardar API
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3081 > /dev/null; then
              echo "API disponível!"
              exit 0
            fi

            echo "Aguardando API..."
            sleep 2
          done

          echo "API não iniciou ainda."
          echo "===== LOG DA API ====="
          cat api.log
          echo "======================"
          exit 1

      - name: Executar testes
        run: npm test
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
          BASE_URL: http://127.0.0.1:3081
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_SENHA: ${{ secrets.ADMIN_SENHA }}
